appId: com.nassila.app
productName: Nassila
directories:
  buildResources: build
  output: dist
# Prune onnxruntime-node's per-platform slices down to the one being packaged, then put them
# back. Hooks rather than `files` negations on purpose — see the script header.
beforePack: ./scripts/prune-native-platforms.mjs
afterPack: ./scripts/prune-native-platforms.mjs
files:
  - out/**/*
  - package.json
  - build/icon.png
  - build/icon.ico
  # Native / worker deps externalized from the main bundle (see electron.vite.config.ts).
  # `canvas` (node-canvas) is deliberately NOT listed: nothing in src/ imports it, it is
  # referenced only by scripts/probe-ocr-bundled.mjs, and it now lives in devDependencies.
  # Runtime rasterization goes through @napi-rs/canvas via pdf.js (see pdf-page-raster.ts).
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-*/**/*
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/@firecrawl/pdf-inspector/**/*
  - node_modules/@firecrawl/pdf-inspector-*/**/*
  - node_modules/@firecrawl/anydoc/**/*
  - node_modules/@firecrawl/anydoc-*/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/ppu-paddle-ocr/**/*
  - node_modules/ppu-ocv/**/*
  # ── Repository content that must never ship in the app bundle ────────────────
  # electron-builder sweeps the app directory, so without these negations a build
  # packs the docs tree (incl. media), agent skills, the source tree, tests, scripts,
  # and a second copy of resources/ that extraResources already places beside the asar.
  # Measured on 2.1.0: 174.6 MB of app.asar was repository content, not app code.
  # The OCR packs are read from process.resourcesPath at runtime (see
  # src/main/maktab/{tesseract-ocr,arabic-paddle-ocr,native-pdf-inspector}.ts),
  # never from inside the asar, so excluding resources/ here is safe.
  - '!docs/**/*'
  - '!.cursor/**/*'
  - '!.github/**/*'
  - '!.vscode/**/*'
  - '!src/**/*'
  - '!tests/**/*'
  - '!scripts/**/*'
  - '!reports/**/*'
  - '!patterns/**/*'
  - '!release-artifacts/**/*'
  - '!resources/**/*'
  - '!*.traineddata'
  - '!codebase.txt'
# Native .node, worker scripts, and WASM must load from a real filesystem path (not asar).
asarUnpack:
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-*/**/*
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/@firecrawl/pdf-inspector/**/*
  - node_modules/@firecrawl/pdf-inspector-*/**/*
  - node_modules/@firecrawl/anydoc/**/*
  - node_modules/@firecrawl/anydoc-*/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/ppu-paddle-ocr/**/*
  - node_modules/ppu-ocv/**/*
extraResources:
  - from: resources/tesseract
    to: tesseract
    filter:
      - '*.traineddata'
      - checksums.sha256
      - README.md
  - from: resources/pdf-inspector
    to: pdf-inspector
    filter:
      - '**/*'
  - from: resources/arabic-ocr
    to: arabic-ocr
    filter:
      - '**/*'
  # Real filesystem paths — nativeImage often cannot load .ico from inside asar.
  - from: build/icon.ico
    to: app-icon.ico
  - from: build/icon.png
    to: app-icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName} Setup ${version}.${ext}
  # Builder pairs rcedit with signing. We stamp via scripts/stamp-win-exe-icon.mjs
  # AFTER --dir and BEFORE --prepackaged nsis/portable (see package.json build:win).
  # Stamping only after a one-shot --win nsis leaves the installer with Electron branding.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Nassila
  uninstallDisplayName: Nassila
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  target:
    - dmg
  icon: build/icon.png
linux:
  target:
    - AppImage
  icon: build/icon.png
